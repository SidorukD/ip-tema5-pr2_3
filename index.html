<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькуляторы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .deposit-bar-container {
            height: 150px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-top: 10px;
        }
        .deposit-bar {
            width: 50px;
            transition: height 0.3s ease;
        }
        .bar-old { background-color: red; }
        .bar-new { background-color: green; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        
        <section class="mb-5 bg-white p-4 rounded shadow-sm">
            <h2 class="text-center mb-4">Решение квадратного уравнения<br><small class="text-muted">ax² + bx + c = 0</small></h2>
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="mb-3">
                        <label for="inputA" class="form-label">A</label>
                        <input type="number" class="form-control" id="inputA" value="1">
                    </div>
                    <div class="mb-3">
                        <label for="inputB" class="form-label">B</label>
                        <input type="number" class="form-control" id="inputB" value="1">
                    </div>
                    <div class="mb-3">
                        <label for="inputC" class="form-label">C</label>
                        <input type="number" class="form-control" id="inputC" value="1">
                    </div>
                    <button class="btn btn-primary" onclick="square()">Рассчитать</button>
                    <div class="mt-4 text-center">
                        <h4>Решение</h4>
                        <div id="quadResult" class="fs-5 mt-2"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white p-4 rounded shadow-sm">
            <h2 class="text-center mb-4">Депозитный калькулятор</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="depAmount" class="form-label">Сумма вклада:</label>
                        <input type="number" class="form-control" id="depAmount" value="10000" oninput="calculate()">
                    </div>
                    <div class="mb-3">
                        <label for="depTerm" class="form-label">Срок вклада:</label>
                        <select class="form-select" id="depTerm" onchange="calculate()">
                            <option value="0.25">3 месяца</option>
                            <option value="0.5" selected>6 месяцев</option>
                            <option value="1">12 месяцев (1 год)</option>
                            <option value="1.5">18 месяцев (1.5 года)</option>
                            <option value="2">24 месяца (2 года)</option>
                            <option value="2.5">30 месяцев (2.5 года)</option>
                            <option value="3">36 месяцев (3 года)</option>
                            <option value="3.5">42 месяца (3.5 года)</option>
                            <option value="4">48 месяцев (4 года)</option>
                            <option value="4.5">54 месяца (4.5 года)</option>
                            <option value="5">60 месяцев (5 лет)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="depRate" class="form-label">Годовая процентная ставка:</label>
                        <input type="number" class="form-control" id="depRate" value="5" oninput="calculate()">
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="row text-center fw-bold mb-2">
                        <div class="col-6">Было</div>
                        <div class="col-6">Станет</div>
                    </div>
                    <div class="row text-center border-bottom pb-2 mb-3">
                        <div class="col-6" id="oldAmountText">10000</div>
                        <div class="col-6" id="newAmountText">0</div>
                    </div>
                    <div class="deposit-bar-container justify-content-center">
                        <div id="barOld" class="deposit-bar bar-old" style="height: 100%;"></div>
                        <div id="barNew" class="deposit-bar bar-new" style="height: 0%;"></div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
